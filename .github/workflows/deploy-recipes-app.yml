name: Deploy recipes-app to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/recipe-generator-app-u7x7Y
    paths:
      - "recipes-app/**"
      - ".github/workflows/deploy-recipes-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: recipes-app
          command: pages deploy . --project-name=carnet-du-chef --branch=${{ github.ref_name }}
