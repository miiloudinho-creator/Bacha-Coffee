# Cloudflare Pages config
# Déploiement :
#   wrangler pages deploy . --project-name=carnet-du-chef
#
# Les bindings (KV + AI) doivent être créés une seule fois.
# Voir README.md pour les commandes pas à pas.

name = "carnet-du-chef"
compatibility_date = "2025-05-01"
pages_build_output_dir = "."

# Binding Workers AI — gratuit (quota Cloudflare).
[ai]
binding = "AI"

# Binding KV — créer le namespace avant via :
#   wrangler kv namespace create INGREDIENTS_KV
# Puis remplacer "REPLACE_WITH_KV_NAMESPACE_ID" par l'ID retourné.
[[kv_namespaces]]
binding = "INGREDIENTS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
